
name: ZenoSkills Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ZenoSkills Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn clean package

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZenoSkills-JAR
          path: target/*.jar
          if-no-files-found: error
          retention-days: 30
